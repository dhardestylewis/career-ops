# Portal Scanner Configuration
# User-specific scan config for Staff ML / AI platform / forward-deployed roles.

title_filter:
  positive:
    - "AI"
    - "ML"
    - "Machine Learning"
    - "LLM"
    - "Agent"
    - "Agentic"
    - "GenAI"
    - "Generative AI"
    - "LLMOps"
    - "MLOps"
    - "Platform"
    - "Infrastructure"
    - "Forward Deployed"
    - "Deployed Engineer"
    - "Solutions Architect"
    - "Solutions Engineer"
    - "Applied"
    - "Data Scientist"
    - "Data Platform"
    - "Research Engineer"
    - "Staff"
    - "Principal"
    - "Lead"
  negative:
    - "Junior"
    - "Intern"
    - "Salesforce Admin"
    - "COBOL"
    - "Mainframe"
    - "PHP"
    - "Ruby"
    - "Android"
    - "iOS"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"

search_queries:
  - name: Ashby â€” AI / Platform
    query: 'site:jobs.ashbyhq.com "AI" OR "Machine Learning" OR "Platform" OR "Forward Deployed" remote'
    enabled: true
  - name: Greenhouse â€” AI / Platform
    query: 'site:job-boards.greenhouse.io OR site:boards.greenhouse.io "AI" OR "Machine Learning" OR "Platform" OR "Forward Deployed" remote'
    enabled: true
  - name: Lever â€” AI / Platform
    query: 'site:jobs.lever.co "AI" OR "Machine Learning" OR "Platform" OR "Forward Deployed" remote'
    enabled: true

