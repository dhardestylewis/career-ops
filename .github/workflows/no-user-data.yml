name: No user data in PRs

# Hard-blocks any PR that adds or modifies user-layer (private data) files.
# These live ONLY on the candidate's machine per DATA_CONTRACT.md and must never
# enter the repo. Sample/fixture data belongs under examples/. Tracked
# scaffolding (.gitkeep keepers, dir READMEs) is exempt.
#
# This guard uses explicit private-file patterns instead of a blanket `data/`
# rule so public-safe archive/assets files do not get swept up by mistake.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const headRef = context.payload.pull_request.head.ref;
            const headSha = context.payload.pull_request.head.sha;
            const baseRef = context.payload.pull_request.base.ref;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });

            // Mirror the private surfaces that this repo actually treats as
            // user-layer. Keep this list explicit so the guard blocks real
            // personal data without tripping on public-safe archive/assets files.
            const USER_PATHS = [
              /^cv\.md$/,
              /^config\/profile\.yml$/,
              /^modes\/_profile\.md$/,
              /^modes\/_custom\.md$/,
              /^voice-dna\.md$/,
              /^portals\.yml$/,
              /^article-digest\.md$/,
              /^data\/(?:bio|cv)\.md$/,
              /^data\/(?:applications\.md|applications\.db|pipeline\.md|scan-history\.tsv|follow-ups\.md)$/,
              /^data\/tracker\//,
              /^data\/state\//,
              /^data\/outreach-[^/]+$/,
              /^interview-prep\//,
              /^reports\//,
              /^output\//,
              /^jds\//,
              /^writing-samples\//,
            ];

            // Tracked scaffolding that legitimately lives under those dirs.
            const isScaffold = (f) => /(^|\/)\.gitkeep$/.test(f) || /(^|\/)README\.md$/.test(f);

            const bad = files
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename)
              .filter((f) => USER_PATHS.some((re) => re.test(f)) && !isScaffold(f));

            if (bad.length) {
              core.setFailed(
                `This PR adds/modifies user-layer (private data) files on ${headRef}@${headSha.slice(0, 7)} ` +
                `(base ${baseRef}). These live ONLY on your machine per DATA_CONTRACT.md and must never be committed — use examples/ for sample data.\n` +
                'Offending files:\n  ' + bad.join('\n  ')
              );
            } else {
              core.info(`OK — no user-layer (private data) files touched in ${headRef}@${headSha.slice(0, 7)} against ${baseRef}.`);
            }
